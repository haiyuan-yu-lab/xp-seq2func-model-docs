site_name: xp-seq2func-model
site_description: User docs for train, tune, and pred CLIs (release 0.1.0a4)
site_url: https://haiyuan-yu-lab.github.io/xp-seq2func-model-docs/
repo_url: https://github.com/haiyuan-yu-lab/xp-seq2func-model
repo_name: haiyuan-yu-lab/xp-seq2func-model

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Concepts: concepts.md
  - Formats: formats.md
  - Config: config.md
  - CLI:
      - Overview: cli/index.md
      - train_model: cli/train_model.md
      - tune_model: cli/tune_model.md
      - pred_model: cli/pred_model.md
  - FAQ: faq.md
